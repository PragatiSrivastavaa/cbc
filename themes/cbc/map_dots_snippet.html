<style>
  /* SVG Wrapper */
  .map-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    /* Height constraint to prevent clipping */
    height: 190px;
    width: 100%;
    position: relative;
    overflow: visible !important;
    margin-bottom: 15px;
    margin-top: 10px;
  }

  /* Force Map Colors - Darkish Theme Blue */
  .map-wrapper svg path {
    fill: #1a3c5e !important;
    stroke: #ffffff;
    stroke-width: 0.5px;
    transition: fill 0.3s ease;
  }

  .map-wrapper svg path:hover {
    fill: #2daae1 !important;
  }

  /* SVG Constraints */
  .map-wrapper svg {
    height: 100% !important;
    width: auto !important;
    max-width: 100%;
    overflow: visible !important;
    display: block;
  }

  /* SVG Dot Styles */
  .map-dot-svg {
    fill: #ff9933;
    /* Theme Orange */
    cursor: pointer;
    /* Center transform origin on the dot itself for pulse */
    transform-box: fill-box;
    transform-origin: center;
    opacity: 0.9;
    animation: svgPulse 2s infinite ease-in-out;
  }

  @keyframes svgPulse {
    0% {
      transform: scale(1);
      opacity: 0.9;
    }

    50% {
      transform: scale(1.4);
      opacity: 1;
    }

    100% {
      transform: scale(1);
      opacity: 0.9;
    }
  }
</style>

<!-- IMAGE TAG -->
<img class="india-map-image map-fade-blink" src="/cbc/sites/default/files/inline-images/indian_map_infocus.svg"
  alt="India Map showing States and Union Territories" width="100%" height="100%" id="infocus-india-map"
  style="display: block; width: 100%; height: auto;">

<script>
  document.addEventListener('DOMContentLoaded', function () {
    console.log("CBC Map Script Loaded - Dots Enabled (Single Unique) v15");

    const checkContainer = setInterval(function () {
      let img = document.getElementById('infocus-india-map');
      if (img && img.complete) {
        clearInterval(checkContainer);
        initDynamicMap(img);
      }
    }, 500);

    function initDynamicMap(img) {
      const svgUrl = img.getAttribute('src');
      if (!svgUrl) return;

      fetch(svgUrl)
        .then(response => {
          if (!response.ok) throw new Error('Network response was not ok');
          return response.text();
        })
        .then(svgText => {
          if (!svgText.trim().startsWith('<svg') && !svgText.includes('<svg')) {
            console.warn('Fetched image is not an SVG');
            return;
          }

          const wrapper = document.createElement('div');
          wrapper.className = 'map-wrapper ' + (img.className || '');

          wrapper.innerHTML = svgText;
          const svg = wrapper.querySelector('svg');

          if (svg) {
            if (!svg.hasAttribute('viewBox')) {
              const w = svg.getAttribute('width') || 611;
              const h = svg.getAttribute('height') || 695;
              svg.setAttribute('viewBox', `0 0 ${parseFloat(w)} ${parseFloat(h)}`);
            }

            svg.style.width = 'auto';
            svg.style.height = '100%';
            svg.style.display = 'block';
            svg.style.overflow = 'visible';

            img.parentNode.insertBefore(wrapper, img);
            img.style.display = 'none';

            requestAnimationFrame(() => addDotsNative(svg));
          }
        })
        .catch(error => console.error('Error loading map SVG:', error));
    }

    function addDotsNative(svg) {
      // User Provided List
      const allowedStates = [
        "andaman and nicobar",
        "andhra pradesh",
        "arunachal pradesh",
        "assam",
        "bihar",
        "chandigarh",
        "chhattisgarh", "chattisgarh",
        "delhi",
        "goa",
        "gujarat",
        "haryana",
        "jammu and kashmir",
        "jharkhand",
        "karnataka",
        "ladakh",
        "madhya pradesh",
        "maharashtra",
        "manipur",
        "meghalaya",
        "mizoram",
        "nagaland",
        "odisha",
        "puducherry",
        "punjab",
        "rajasthan",
        "tripura",
        "uttar pradesh",
        "uttarakhand"
      ];

      const normalizeName = (name) => {
        if (!name) return '';
        return name.toLowerCase()
          .replace('&', 'and')
          .replace('islands', '')
          .replace('island', '')
          .trim();
      };

      const stateLargestPath = new Map();
      const paths = svg.querySelectorAll('path');

      // 1. DEDUPLICATION: Find ONLY the largest path for each state
      paths.forEach(path => {
        if (path.closest('defs')) return;

        const id = path.id || '';
        const rawTitle = path.getAttribute('title') || '';
        const normalizedTitle = normalizeName(rawTitle);

        if (id.startsWith('IN-')) {
          const matchedState = allowedStates.find(state => normalizedTitle.includes(state));

          if (matchedState) {
            try {
              const bbox = path.getBBox();
              const area = bbox.width * bbox.height;

              if (bbox.width <= 0 || bbox.height <= 0) return;

              if (!stateLargestPath.has(matchedState) || area > stateLargestPath.get(matchedState).area) {
                stateLargestPath.set(matchedState, {
                  path: path,
                  bbox: bbox,
                  title: rawTitle
                });
              }
            } catch (e) { }
          }
        }
      });

      // 2. RENDER: Add One Circle per State
      stateLargestPath.forEach((data, stateName) => {
        try {
          const path = data.path;
          const bbox = data.bbox;

          const cx = bbox.x + bbox.width / 2;
          const cy = bbox.y + bbox.height / 2;

          const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          circle.setAttribute("cx", cx);
          circle.setAttribute("cy", cy);

          // Radius 4 for clean, visible dot
          circle.setAttribute("r", "4");
          circle.setAttribute("class", "map-dot-svg");

          if (data.title) {
            const titleEl = document.createElementNS("http://www.w3.org/2000/svg", "title");
            titleEl.textContent = data.title;
            circle.appendChild(titleEl);
          }

          // Staggered animation
          const safeH = svg.viewBox.baseVal.height || 700;
          const normalizedY = cy / safeH;
          const delay = (normalizedY * 1.5).toFixed(2) + 's';
          circle.style.animationDelay = delay;

          // Inject into path's parent to inherit transforms
          path.parentNode.appendChild(circle);

        } catch (e) {
          console.error("Error creating SVG dot for " + stateName, e);
        }
      });
    }
  });
</script>
